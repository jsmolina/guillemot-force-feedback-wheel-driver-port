name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat"

      - name: Get ViGEmClient vcpkg port
        shell: pwsh
        run: |
          git clone https://github.com/nefarius/ViGEmClient.vcpkg.git `
            "$env:GITHUB_WORKSPACE\ports\vigemclient"

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            --overlay-ports="$env:GITHUB_WORKSPACE\ports"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            "-DVCPKG_OVERLAY_PORTS=$env:GITHUB_WORKSPACE\ports"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\iforce_vigem_port.exe dist\
          Compress-Archive `
            -Path dist\* `
            -DestinationPath iforce-vigem-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iforce-vigem-windows-x64
          path: iforce-vigem-windows-x64.zip
